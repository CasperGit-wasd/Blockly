<!DOCTYPE html>
<html lang="zh-Hant">
<head>
  <meta charset="UTF-8" />
  <title>BlocklyWorkSpaceDemo</title>
  <script src="https://unpkg.com/blockly/blockly.min.js"></script>
  <style>
    html, body {
      height: 100%;
      margin: 0;
      font-family: sans-serif;
    }
    #blocklyDiv {
      height: calc(100vh - 50px);
      width: 100%;
    }
    #controls {
      height: 50px;
      background: #333;
      color: white;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 10px;
    }
    button {
      padding: 6px 12px;
      font-size: 16px;
      cursor: pointer;
    }
  </style>
</head>
<body>

  <!-- Mission Control -->
  <div id="controls">
    <button onclick="runCode()">Run</button>
    <button onclick="pauseCode()">Pause</button>
    <button onclick="stopCode()">Stop</button>
    <button onclick="resetWorkspace()">Reset</button>
  </div>

  <!-- Blockly's Space-->
  <div id="blocklyDiv"></div>

  <!-- Toolbox Definition -->
  <xml id="toolbox" style="display: none">
    <category name="controls" colour="#5C81A6">
      <block type="controls_if"></block>
      <block type="controls_repeat_ext">
        <value name="TIMES">
          <shadow type="math_number">
            <field name="NUM">5</field>
          </shadow>
        </value>
      </block>
    </category>
    <category name="operators" colour="#5CA65C">
      <block type="math_number">
        <field name="NUM">123</field>
      </block>
      <block type="math_arithmetic"></block>
    </category>
    <category name="variables" custom="VARIABLE" colour="#A65C81"></category>
    <category name="output" colour="#FFA500">
      <block type="text_print"></block>
    </category>
    <category name="text" colour="#FF6680">
      <block type="text"></block>
      <block type="text_join"></block>
    </category>
  </xml>

  <script>
    let workspace = Blockly.inject('blocklyDiv', {
      toolbox: document.getElementById('toolbox'),
      trashcan: true,
      zoom: {
        controls: true,
        wheel: true
      },
      grid: {
        spacing: 20,
        length: 3,
        colour: '#ccc',
        snap: true
      }
    });
    
    Blockly.JavaScript['text_print'] = function(block) {
      const msg = Blockly.JavaScript.valueToCode(block, 'TEXT', Blockly.JavaScript.ORDER_NONE) || '\'\'';
      return 'if (running) console.log(' + msg + ');\n';
    };

    let running = false;

    function runCode() {
      const code = Blockly.JavaScript.workspaceToCode(workspace);
      running = true;
      try {
        eval(code);
      } catch (e) {
        console.error('problem detetecd:', e);
      }
    }

    function stopCode() {
      running = false;
      console.warn("stopped running");
    }

    function stopWorkspace() {
      running = false;
      Blockly.getMainWorkspace().clear();
    }
  </script>
</body>
</html>
